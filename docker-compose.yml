# Сайт + HTTPS (Caddy сам получает сертификат Let's Encrypt).
# Запуск: cp .env.example .env && nano .env && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
    volumes:
      - sl-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  sl-data:
  caddy-data:
  caddy-config:
